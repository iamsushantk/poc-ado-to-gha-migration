name: Workflows - deploy application

on:
  repository_dispatch:
    types: [deploy]

run-name: Deploy ${{ github.event.client_payload.application_repository }} to ${{ github.event.client_payload.environment }} @ ${{ github.event.client_payload.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.client_payload.environment }}
    concurrency:
      group: deploy-${{ github.event.client_payload.application_repository }}-${{ github.event.client_payload.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate dispatch payload
        run: |
          set -euo pipefail
          test -n "${{ github.event.client_payload.application_repository }}"
          test -n "${{ github.event.client_payload.ref }}"
          test -n "${{ github.event.client_payload.environment }}"
          test -n "${{ github.event.client_payload.image_name }}"

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.application_repository }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PLATFORM_WORKFLOW_TOKEN }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Build and push image
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ github.event.client_payload.image_name }}:${{ github.event.client_payload.ref }}
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Update App Service
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ github.event.client_payload.image_name }}:${{ github.event.client_payload.ref }}
        run: az webapp config container set --name "${{ vars.APP_SERVICE_NAME }}" --resource-group "${{ vars.RESOURCE_GROUP }}" --docker-custom-image-name "$IMAGE"
