name: Subscription portal - CI

on:
  pull_request:
    paths: ['projects/subscription-portal/**', 'package.json', 'package-lock.json']
  push:
    branches: [main]
    paths: ['projects/subscription-portal/**', 'package.json', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/subscription-portal

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      # Fast, cheap checks first so formatting/lint mistakes fail before the slower Docker build.
      - name: Lint Next.js application
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build Docker image
        run: docker build --tag subscription-portal:ci .
