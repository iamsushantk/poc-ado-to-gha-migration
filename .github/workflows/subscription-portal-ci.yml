name: Subscription portal - CI

on:
  pull_request:
    paths: ['projects/subscription-portal/**', 'package.json', 'package-lock.json']
  push:
    branches: [main]
    paths: ['projects/subscription-portal/**', 'package.json', 'package-lock.json']
  workflow_dispatch:
    inputs:
      environment:
        description: Azure/GitHub environment to build and deploy to
        required: true
        type: choice
        options: [dev, sit, uat, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: subscription-portal-ci-${{ github.ref }}
  # Only cancel superseded PR runs; never cancel an in-progress build-and-push/deploy on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: projects/subscription-portal

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      # Fast, cheap checks first so formatting/lint mistakes fail before the slower Docker build.
      - name: Lint Next.js application
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build Docker image
        run: docker build --tag subscription-portal:ci .

  build-and-push:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      ref: ${{ github.sha }}
      environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Build and push image
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/subscription-portal:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

  trigger-deployment:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/subscription-portal-cd.yml
    with:
      environment: ${{ needs.build-and-push.outputs.environment }}
      ref: ${{ needs.build-and-push.outputs.ref }}
      image_name: subscription-portal
    secrets: inherit

