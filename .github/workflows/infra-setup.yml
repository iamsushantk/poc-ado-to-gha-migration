name: Infra - set up environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to set up
        required: true
        type: choice
        options:
          - dev
          - sit
          - uat
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      PLATFORM_REPOSITORY: ${{ github.event.repository.name }}
      AZURE_LOCATION: australiaeast
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Azure resources
        working-directory: projects/infra
        run: bash scripts/provision-azure.sh "$ENVIRONMENT"

      - name: Provision GitHub Environment
        working-directory: projects/infra
        run: bash scripts/provision-github.sh "$ENVIRONMENT"
