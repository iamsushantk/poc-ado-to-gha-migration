name: Workflows - CD

on:
  repository_dispatch:
    types: [deploy]

run-name: Deploy ${{ github.event.client_payload.application_repository }} to ${{ github.event.client_payload.environment }} @ ${{ github.event.client_payload.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.client_payload.environment }}
    concurrency:
      group: deploy-${{ github.event.client_payload.application_repository }}-${{ github.event.client_payload.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate dispatch payload
        run: |
          set -euo pipefail
          test -n "${{ github.event.client_payload.application_repository }}"
          test -n "${{ github.event.client_payload.ref }}"
          test -n "${{ github.event.client_payload.environment }}"
          test -n "${{ github.event.client_payload.image_name }}"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update App Service
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ github.event.client_payload.image_name }}:${{ github.event.client_payload.ref }}
        run: |
          # Registry URL and managed-identity pull credentials are configured once during
          # provisioning (configure_acr_pull); only the image tag changes on each deploy, so we
          # avoid re-passing --container-registry-url here, which would otherwise trigger the
          # CLI's admin-credential auto-lookup (and its warnings/failures) on every deployment.
          az webapp config container set --name "${{ vars.APP_SERVICE_NAME }}" --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --container-image-name "$IMAGE"
          az webapp restart --name "${{ vars.APP_SERVICE_NAME }}" --resource-group "${{ vars.RESOURCE_GROUP }}"

