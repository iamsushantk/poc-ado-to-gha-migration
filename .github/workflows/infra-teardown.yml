name: Infra - tear down environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to tear down
        required: true
        type: choice
        options: [dev, sit, uat, prod]
      confirmation:
        description: Type DESTROY to confirm permanent deletion
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  teardown:
    if: inputs.confirmation == 'DESTROY'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      WORKFLOW_REPOSITORY: ${{ github.event.repository.name }}
      AZURE_LOCATION: australiaeast
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether GitHub Environment exists
        id: environment
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/environments/${ENVIRONMENT}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Environment '$ENVIRONMENT' does not exist; skipping teardown."
          fi

      - name: Log in to Azure
        if: steps.environment.outputs.exists == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Tear down GitHub Environment
        if: steps.environment.outputs.exists == 'true'
        working-directory: projects/infra
        run: printf '%s\n' "$ENVIRONMENT" | bash scripts/teardown-github.sh "$ENVIRONMENT"

      - name: Tear down Azure resources
        if: steps.environment.outputs.exists == 'true'
        working-directory: projects/infra
        run: printf '%s\n' "$ENVIRONMENT" | bash scripts/teardown-azure.sh "$ENVIRONMENT"
