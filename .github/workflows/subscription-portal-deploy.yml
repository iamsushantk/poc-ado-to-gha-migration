name: Subscription portal - deploy

on:
  push:
    branches: [main]
    paths: ['projects/subscription-portal/**']
  workflow_dispatch:
    inputs:
      environment:
        description: Azure/GitHub environment to deploy
        required: true
        type: choice
        options: [dev, sit, uat, prod]
        default: dev

permissions:
  contents: read

jobs:
  request-deployment:
    environment: ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate platform GitHub App configuration
        env:
          PLATFORM_WORKFLOW_TOKEN: ${{ secrets.PLATFORM_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PLATFORM_WORKFLOW_TOKEN" || {
            echo "::error::Missing PLATFORM_WORKFLOW_TOKEN repository secret."
            exit 1
          }

      - name: Dispatch platform deployment
        id: dispatch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PLATFORM_WORKFLOW_TOKEN }}
          script: |
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            const commitMessage = commit.data.commit.message
              .split('\n', 1)[0]
              .trim()
              .slice(0, 100);

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'deploy',
              client_payload: {
                application_repository: context.repo.owner + '/' + context.repo.repo,
                application_repository_name: context.repo.repo,
                ref: context.sha,
                commit_message: commitMessage,
                environment: '${{ github.event.inputs.environment || 'dev' }}',
                image_name: 'subscription-portal',
                source_run_id: String(context.runId)
              }
            });

      - name: Wait for platform deployment
        id: platform-result
        uses: actions/github-script@v7
        env:
          PLATFORM_REPOSITORY: ${{ github.repository }}
          APPLICATION_REPOSITORY: ${{ github.repository }}
          APPLICATION_REF: ${{ github.sha }}
          ENVIRONMENT_NAME: ${{ github.event.inputs.environment || 'dev' }}
        with:
          github-token: ${{ secrets.PLATFORM_WORKFLOW_TOKEN }}
          script: |
            const [owner, repo] = process.env.PLATFORM_REPOSITORY.split('/');
            const refMarker = process.env.APPLICATION_REF.slice(0, 12);
            const startedAt = Date.now();
            const timeoutMs = 15 * 60 * 1000;
            let platformRun;

            while (Date.now() - startedAt < timeoutMs) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                workflow_id: 'workflows-deploy.yml',
                event: 'repository_dispatch',
                per_page: 100
              });

              platformRun = response.data.workflow_runs.find((run) =>
                run.display_title.includes(process.env.APPLICATION_REPOSITORY) &&
                run.display_title.includes(`to ${process.env.ENVIRONMENT_NAME}`) &&
                run.display_title.includes(refMarker) &&
                new Date(run.created_at).getTime() >= startedAt - 60_000
              );

              if (platformRun && platformRun.status === 'completed') {
                core.setOutput('run-url', platformRun.html_url);
                core.setOutput('conclusion', platformRun.conclusion);
                core.info(`Platform run: ${platformRun.html_url}`);
                core.info(`Platform conclusion: ${platformRun.conclusion}`);
                if (platformRun.conclusion !== 'success') {
                  core.setFailed(`Platform deployment completed with conclusion: ${platformRun.conclusion}`);
                }
                return;
              }

              if (platformRun) {
                core.info(`Platform run ${platformRun.html_url} is ${platformRun.status}`);
              } else {
                core.info('Waiting for the workflows deployment run to appear...');
              }

              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            core.setFailed(`Timed out waiting for the platform deployment for ${refMarker}`);

      - name: Platform deployment summary
        if: always()
        env:
          PLATFORM_RUN_URL: ${{ steps.platform-result.outputs.run-url }}
          PLATFORM_CONCLUSION: ${{ steps.platform-result.outputs.conclusion }}
        run: |
          {
            echo "## Platform deployment"
            echo ""
            echo "- **Application:** \`${{ github.repository }}\`"
            echo "- **Environment:** \`${{ github.event.inputs.environment || 'dev' }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Platform run:** ${PLATFORM_RUN_URL:-not found}"
            echo "- **Platform result:** \`${PLATFORM_CONCLUSION:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
